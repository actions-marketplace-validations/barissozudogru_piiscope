version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: privacyapp
      POSTGRES_PASSWORD: privacypass
      POSTGRES_DB: privacydb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:6
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: gdpr_privacy_app/deploy/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://privacyapp:privacypass@db:5432/privacydb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: supersecretjwtkey
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY: supersecret16byteskey
      DATA_RETENTION_HOURS: '24'
      ALLOW_EGRESS: 'false'
      DEFAULT_ADMIN_USER: admin
      DEFAULT_ADMIN_PASSWORD: admin
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: gdpr_privacy_app/deploy/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://privacyapp:privacypass@db:5432/privacydb
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: supersecretjwtkey
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY: supersecret16byteskey
      DATA_RETENTION_HOURS: '24'
    depends_on:
      - db
      - redis

  ui:
    build:
      context: ..
      dockerfile: gdpr_privacy_app/deploy/Dockerfile.ui
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db_data: